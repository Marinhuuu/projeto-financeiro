<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>


<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200 flex flex-col">

    <!-- BOTÃO DARK MODE -->
    <div class="flex justify-end p-4">
        <button type="button"
                onclick="toggleDarkMode()"
                class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition duration-150 shadow-sm"
                title="Alternar Modo Escuro/Claro">
            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>
    </div>

    <main class="flex-1 flex items-center justify-center px-4 pb-16">

        <div class="w-full max-w-sm">

            <!-- LOGO -->
            <div class="flex flex-col items-center mb-8">
                <div class="p-3 bg-indigo-600 text-white rounded-2xl shadow-md shadow-indigo-200 dark:shadow-none mb-4">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Controle Financeiro</h1>
                <p class="text-sm font-medium text-slate-400 mt-1">Entre com o seu CPF e senha</p>
            </div>

            <!-- MENSAGENS -->
            <div th:replace="~{fragments/navbar :: flash}"></div>

            <!-- FORMULÁRIO -->
            <form th:action="@{/login}"
                  method="POST"
                  class="mt-4 bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-5 transition-colors">

                <div>
                    <label for="cpf" class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
                        CPF
                    </label>
                    <input type="text"
                           id="cpf"
                           name="cpf"
                           th:value="${cpfInformado}"
                           required
                           autofocus
                           inputmode="numeric"
                           autocomplete="username"
                           maxlength="14"
                           placeholder="000.000.000-00"
                           class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400 tabular-nums">
                </div>

                <div>
                    <label for="senha" class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
                        Senha
                    </label>
                    <input type="password"
                           id="senha"
                           name="senha"
                           autocomplete="current-password"
                           placeholder="••••••••"
                           class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
                    <p class="text-xs text-slate-400 mt-1.5">
                        Primeiro acesso? Informe só o CPF para criar a sua senha.
                    </p>
                </div>

                <button type="submit"
                        class="w-full inline-flex justify-center items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-bold px-6 py-3 rounded-xl shadow-sm transition-all duration-150">
                    Entrar
                </button>

            </form>

        </div>

    </main>

    <script>
        /*
         * MÁSCARA DE CPF: 000.000.000-00
         */
        const cpfInput = document.getElementById('cpf');

        function formatarCpf(valor) {
            const d = (valor || '').replace(/\D/g, '').slice(0, 11);
            return d
                .replace(/^(\d{3})(\d)/, '$1.$2')
                .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
                .replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
        }

        cpfInput.addEventListener('input', function (e) {
            e.target.value = formatarCpf(e.target.value);
        });

        cpfInput.value = formatarCpf(cpfInput.value);
    </script>

</body>

</html>
