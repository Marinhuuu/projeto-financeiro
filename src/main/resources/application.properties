spring.application.name=financeiro

## --- JPA / Hibernate ---

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Carrega associações em lotes (evita uma consulta por registro nas listagens)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# A conexão com o banco é liberada ao fim do service, e não só depois de montar a tela
spring.jpa.open-in-view=false

# --- Pool de conexões ---
# Sem conexões paradas abertas: o Neon (plano gratuito) desliga o banco ocioso
# e não gasta horas de computação enquanto ninguém usa o sistema
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.maximum-pool-size=5

# --- Thymeleaf ---
# Cache de templates ligado (padrão); o profile dev desliga para recarregar as telas

# --- Servidor ---
# No Render a porta vem da variavel PORT (padrao 10000)

server.port=${PORT:8080}
server.address=0.0.0.0

# --- Sessão ---
# Cookie de sessão não vai em requisições vindas de outros sites (reforço contra CSRF)
server.servlet.session.cookie.same-site=lax
# Usa os cabeçalhos X-Forwarded-* do proxy do Render (IP real e HTTPS)
server.forward-headers-strategy=native
