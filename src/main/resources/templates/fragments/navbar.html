<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- ========================================================= -->
    <!-- MENU LATERAL -->
    <!-- Desktop (lg+): fixo à esquerda, o conteúdo da página é deslocado.
         Celular: barra no topo com botão que abre o menu como gaveta. -->
    <!-- ========================================================= -->
    <div th:fragment="navbar">

        <style>
            @media (min-width: 1024px) {
                body { padding-left: 16rem; }
            }
        </style>

        <!-- BARRA DO TOPO (SÓ NO CELULAR) -->
        <header class="lg:hidden sticky top-0 z-40 mb-6 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center justify-between px-4 h-14">
                <a th:href="@{/home}" class="flex items-center gap-2.5">
                    <div class="p-1.5 bg-indigo-600 text-white rounded-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-slate-900 dark:text-white tracking-tight">Controle Financeiro</span>
                </a>
                <button type="button" onclick="abrirMenuLateral(true)"
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                        title="Abrir menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- FUNDO ESCURO DA GAVETA (SÓ NO CELULAR) -->
        <div id="menuLateralFundo" onclick="abrirMenuLateral(false)"
             class="hidden fixed inset-0 z-40 bg-slate-900/50 lg:hidden"></div>

        <!-- MENU -->
        <aside id="menuLateral"
               class="fixed inset-y-0 left-0 z-50 w-64 flex flex-col bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 -translate-x-full lg:translate-x-0 transition-transform duration-200">

            <!-- LOGO / NOME DO SISTEMA -->
            <div class="flex items-center justify-between px-5 h-16 border-b border-slate-100 dark:border-slate-800 shrink-0">
                <a th:href="@{/home}" class="flex items-center gap-3 group">
                    <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-100 dark:shadow-none group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-slate-900 dark:text-white tracking-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                        Controle Financeiro
                    </span>
                </a>
                <button type="button" onclick="abrirMenuLateral(false)"
                        class="lg:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" title="Fechar menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- ITENS DE NAVEGAÇÃO (a cor de cada módulo aparece no hover e no item ativo) -->
            <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5 text-sm font-medium">

                <div class="space-y-1">
                    <a th:href="@{/home}" data-cor="indigo"
                       class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 hover:text-indigo-700 dark:hover:text-indigo-300 transition">
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Início
                    </a>
                </div>

                <div>
                    <p class="px-3 mb-1.5 text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">Receitas</p>
                    <div class="space-y-1">
                        <a th:href="@{/receita}" data-cor="emerald"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 hover:text-emerald-700 dark:hover:text-emerald-300 transition">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Nova receita
                        </a>
                        <a th:href="@{/receita/receitas}" data-cor="emerald"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 hover:text-emerald-700 dark:hover:text-emerald-300 transition">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Gerenciar receitas
                        </a>
                    </div>
                </div>

                <div>
                    <p class="px-3 mb-1.5 text-[11px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400">Despesas</p>
                    <div class="space-y-1">
                        <a th:href="@{/despesa}" data-cor="rose"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-950/40 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span> Nova despesa
                        </a>
                        <a th:href="@{/despesa/despesas}" data-cor="rose"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-950/40 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span> Gerenciar despesas
                        </a>
                        <a th:href="@{/despesa/terceiros}" data-cor="rose"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-950/40 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span> Terceiros
                        </a>
                    </div>
                </div>

                <div>
                    <p class="px-3 mb-1.5 text-[11px] font-bold uppercase tracking-wider text-sky-600 dark:text-sky-400">Cartão</p>
                    <div class="space-y-1">
                        <a th:href="@{/parcela}" data-cor="sky"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-700 dark:hover:text-sky-300 transition">
                            <span class="w-2 h-2 rounded-full bg-sky-500"></span> Parcelas
                        </a>
                        <a th:href="@{/faturas}" data-cor="indigo"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 hover:text-indigo-700 dark:hover:text-indigo-300 transition">
                            <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Faturas
                        </a>
                    </div>
                </div>

                <div>
                    <p class="px-3 mb-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-400">Cadastros</p>
                    <div class="space-y-1">
                        <a th:href="@{/categoria}" data-cor="orange"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-orange-50 dark:hover:bg-orange-950/40 hover:text-orange-700 dark:hover:text-orange-300 transition">
                            <span class="w-2 h-2 rounded-full bg-orange-500"></span> Categorias
                        </a>
                        <a th:href="@{/cartao}" data-cor="amber"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-amber-50 dark:hover:bg-amber-950/40 hover:text-amber-700 dark:hover:text-amber-300 transition">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> Cartões
                        </a>
                        <a th:href="@{/pessoa}" data-cor="slate"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span> Pessoas
                        </a>
                        <a th:href="@{/usuario}" data-cor="violet"
                           class="menu-item flex items-center gap-3 px-3 py-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-violet-50 dark:hover:bg-violet-950/40 hover:text-violet-700 dark:hover:text-violet-300 transition">
                            <span class="w-2 h-2 rounded-full bg-violet-500"></span> Usuários
                        </a>
                    </div>
                </div>

            </nav>

            <!-- RODAPÉ: USUÁRIO LOGADO / TEMA / SAIR -->
            <div class="shrink-0 border-t border-slate-100 dark:border-slate-800 p-3 space-y-2">
                <p th:if="${usuarioLogadoNome != null}"
                   class="px-2 text-sm font-semibold text-slate-600 dark:text-slate-300 truncate"
                   th:text="${'Olá, ' + usuarioLogadoNome}">Olá, Gabriel</p>
                <div class="flex items-center gap-2">
                    <button type="button"
                            onclick="toggleDarkMode()"
                            class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition duration-150 shadow-sm flex items-center justify-center"
                            title="Alternar Modo Escuro/Claro">
                        <!-- Ícone Sol (Modo Escuro) -->
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                        <!-- Ícone Lua (Modo Claro) -->
                        <svg class="w-5 h-5 block dark:hidden text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <form th:if="${usuarioLogadoNome != null}"
                          th:action="@{/logout}"
                          method="POST"
                          class="flex-1">
                        <button type="submit"
                                class="w-full px-3 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition duration-150 border border-slate-200 dark:border-slate-700">
                            Sair
                        </button>
                    </form>
                </div>
            </div>
        </aside>

        <!-- ESPAÇO ACIMA DO CONTEÚDO NO DESKTOP (a barra do celular já tem margem) -->
        <div class="hidden lg:block h-8"></div>

        <script>
            function abrirMenuLateral(abrir) {
                document.getElementById('menuLateral').classList.toggle('-translate-x-full', !abrir);
                document.getElementById('menuLateralFundo').classList.toggle('hidden', !abrir);
            }

            // Destaca o item da página atual (o caminho mais longo que combina vence:
            // /despesa/terceiros não acende também /despesa)
            (function () {
                const caminho = window.location.pathname;
                let ativo = null;
                document.querySelectorAll('#menuLateral .menu-item').forEach(function (a) {
                    const href = a.getAttribute('href');
                    const combina = caminho === href || (caminho.startsWith(href + '/') && !/\/(despesas|receitas|terceiros)$/.test(href));
                    if (combina && (!ativo || href.length > ativo.getAttribute('href').length)) {
                        ativo = a;
                    }
                });
                if (ativo) {
                    const cor = ativo.dataset.cor;
                    ativo.classList.add('font-bold', 'bg-' + cor + '-50', 'text-' + cor + '-700', 'dark:bg-' + cor + '-950/40', 'dark:text-' + cor + '-300');
                    ativo.classList.remove('text-slate-700', 'dark:text-slate-300');
                }
            })();
        </script>
    </div>

    <!-- ========================================================= -->
    <!-- FLASH MESSAGES (sucesso / erro) -->
    <!-- ========================================================= -->
    <div th:fragment="flash" th:if="${mensagem}"
         th:classappend="${tipoMensagem == 'sucesso'}
                         ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200'
                         : 'bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200'"
         class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 mb-2">
        <div th:classappend="${tipoMensagem == 'sucesso'}
                              ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200'
                              : 'bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200'"
             class="flex items-center gap-3 border rounded-xl px-4 py-3 text-sm font-medium shadow-sm">
            <!-- Ícone sucesso -->
            <svg th:if="${tipoMensagem == 'sucesso'}" class="w-5 h-5 shrink-0 text-emerald-600 dark:text-emerald-400"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <!-- Ícone erro -->
            <svg th:if="${tipoMensagem != 'sucesso'}" class="w-5 h-5 shrink-0 text-rose-600 dark:text-rose-400"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${mensagem}">Mensagem aqui</span>
        </div>
    </div>

</body>
</html>
