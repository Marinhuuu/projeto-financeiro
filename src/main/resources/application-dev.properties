spring.application.name=financeiro
# --- Postgres local ---
# Credenciais via variaveis de ambiente ou pelo arquivo .env na raiz do projeto
# (nao versionado). Exemplo de .env:
#   DBPassword=sua_senha
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DBUrl:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DBUsername:sa}
spring.datasource.password=${DBPassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
