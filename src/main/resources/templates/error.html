<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro · MyFin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tema-tailwind.js}"></script>
    <link rel="stylesheet" th:href="@{/css/myfin.css}">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>

<!-- Página de erro do Spring Boot (BasicErrorController) e do TratamentoErrosAdvice.
     A mensagem é escolhida pelo status, nunca pelo texto da exceção. -->
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 text-center">

        <p class="text-5xl font-extrabold text-slate-300 dark:text-slate-700 tabular-nums"
           th:text="${status}">500</p>

        <h1 class="mt-3 text-xl font-bold text-slate-900 dark:text-white tracking-tight"
            th:text="${status == 403} ? 'Formulário expirado' : (${status == 404} ? 'Página não encontrada' : 'Algo deu errado')">
            Algo deu errado
        </h1>

        <p class="mt-2 text-sm font-medium text-slate-500 dark:text-slate-400"
           th:text="${status == 403} ? 'Recarregue a página e tente novamente.' : (${status == 404} ? 'O endereço acessado não existe.' : 'Não foi possível concluir a operação. Tente novamente.')">
            Não foi possível concluir a operação. Tente novamente.
        </p>

        <a th:href="@{/home}"
           class="mt-6 inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-bold px-6 py-3 rounded-xl shadow-sm transition-all duration-150">
            Voltar ao início
        </a>

    </div>

</body>

</html>
