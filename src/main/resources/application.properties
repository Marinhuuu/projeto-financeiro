spring.application.name=financeiro
# --- Postgres local ---
spring.datasource.url=jdbc:postgresql://localhost:5432/financeiro
spring.datasource.username=sa
spring.datasource.password=Thagab02
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# em dev, "update" atualiza o schema automaticamente a partir das @Entity.
# se você adicionar Flyway/Liquibase depois, troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Thymeleaf ---
# desliga o cache de templates em dev, assim as mudanças no HTML aparecem sem reiniciar
spring.thymeleaf.cache=false