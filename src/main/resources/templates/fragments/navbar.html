<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- ========================================================= -->
    <!-- NAVBAR HORIZONTAL ESTÁTICA / FIXA -->
    <!-- ========================================================= -->
    <nav th:fragment="navbar" class="w-full bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 mb-8 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center min-h-[4rem] py-2 sm:py-0">

            <!-- LOGO / NOME DO SISTEMA -->
            <a th:href="@{/home}" class="flex items-center gap-3 group transition shrink-0 mr-4">
                <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-100 dark:shadow-none group-hover:scale-105 transition-transform">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <span class="text-lg font-bold text-slate-900 dark:text-white tracking-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                    Controle Financeiro
                </span>
            </a>

            <!-- ITENS DE NAVEGAÇÃO -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">

                <!-- INÍCIO -->
                <a th:href="@{/home}"
                   class="px-3.5 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 rounded-xl transition duration-150 border border-slate-200 dark:border-slate-700">
                    Início
                </a>

                <!-- CATEGORIAS -->
                <a th:href="@{/categoria}"
                   class="px-3.5 py-2 text-sm font-medium text-orange-700 dark:text-orange-300 bg-orange-50 dark:bg-orange-950/40 hover:bg-orange-100/80 dark:hover:bg-orange-900/50 rounded-xl transition duration-150 border border-orange-100 dark:border-orange-800/40">
                    Categorias
                </a>

                <!-- CARTÕES -->
                <a th:href="@{/cartao}"
                   class="px-3.5 py-2 text-sm font-medium text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100/80 dark:hover:bg-amber-900/50 rounded-xl transition duration-150 border border-amber-100 dark:border-amber-800/40">
                    Cartões
                </a>

                <!-- PESSOAS -->
                <a th:href="@{/pessoa}"
                   class="px-3.5 py-2 text-sm font-medium text-gray-700 dark:text-slate-300 bg-gray-50 dark:bg-slate-800/60 hover:bg-gray-100/80 dark:hover:bg-slate-700/60 rounded-xl transition duration-150 border border-gray-100 dark:border-slate-700">
                    Pessoas
                </a>

                <!-- USUÁRIOS -->
                <a th:href="@{/usuario}"
                   class="px-3.5 py-2 text-sm font-medium text-violet-700 dark:text-violet-300 bg-violet-50 dark:bg-violet-950/40 hover:bg-violet-100/80 dark:hover:bg-violet-900/50 rounded-xl transition duration-150 border border-violet-100 dark:border-violet-800/40">
                    Usuários
                </a>

                <!-- RECEITA (DROPDOWN) -->
                <div class="relative inline-block text-left">
                    <button type="button"
                            id="btnMenuReceita"
                            onclick="toggleNavDropdown('menuReceita', event)"
                            class="px-3.5 py-2 text-sm font-medium bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100/80 dark:hover:bg-emerald-900/50 rounded-xl transition duration-150 border border-emerald-100 dark:border-emerald-800/40 flex items-center gap-1.5">
                        Receita
                        <span class="text-xs opacity-60">▾</span>
                    </button>

                    <div id="menuReceita"
                         class="hidden absolute right-0 top-full mt-2 w-44 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 py-1.5 z-50">
                        <a th:href="@{/receita}"
                           class="block px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-50/80 dark:hover:bg-emerald-950/50 hover:text-emerald-700 dark:hover:text-emerald-300 transition">
                            Inserir
                        </a>
                        <a th:href="@{/receita/receitas}"
                           class="block px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-emerald-50/80 dark:hover:bg-emerald-950/50 hover:text-emerald-700 dark:hover:text-emerald-300 transition">
                            Gerenciar
                        </a>
                    </div>
                </div>

                <!-- DESPESA (DROPDOWN) -->
                <div class="relative inline-block text-left">
                    <button type="button"
                            id="btnMenuDespesa"
                            onclick="toggleNavDropdown('menuDespesa', event)"
                            class="px-3.5 py-2 text-sm font-medium bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 hover:bg-rose-100/80 dark:hover:bg-rose-900/50 rounded-xl transition duration-150 border border-rose-100 dark:border-rose-800/40 flex items-center gap-1.5">
                        Despesa
                        <span class="text-xs opacity-60">▾</span>
                    </button>

                    <div id="menuDespesa"
                         class="hidden absolute right-0 top-full mt-2 w-44 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 py-1.5 z-50">
                        <a th:href="@{/despesa}"
                           class="block px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-rose-50/80 dark:hover:bg-rose-950/50 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            Inserir
                        </a>
                        <a th:href="@{/despesa/despesas}"
                           class="block px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-rose-50/80 dark:hover:bg-rose-950/50 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            Gerenciar
                        </a>
                        <a th:href="@{/despesa/terceiros}"
                           class="block px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-rose-50/80 dark:hover:bg-rose-950/50 hover:text-rose-700 dark:hover:text-rose-300 transition">
                            Terceiros
                        </a>
                    </div>
                </div>

                <!-- PARCELAS -->
                <a th:href="@{/parcela}"
                   class="px-3.5 py-2 text-sm font-medium bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 hover:bg-sky-100/80 dark:hover:bg-sky-900/50 rounded-xl transition duration-150 border border-sky-100 dark:border-sky-800/40">
                    Parcelas
                </a>

                <!-- FATURAS -->
                <a th:href="@{/faturas}"
                   class="px-3.5 py-2 text-sm font-medium bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100/80 dark:hover:bg-indigo-900/50 rounded-xl transition duration-150 border border-indigo-100 dark:border-indigo-800/40">
                    Faturas
                </a>

                <!-- BOTÃO DARK MODE -->
                <button type="button"
                        onclick="toggleDarkMode()"
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition duration-150 shadow-sm flex items-center justify-center ml-1"
                        title="Alternar Modo Escuro/Claro">
                    <!-- Ícone Sol (Modo Escuro) -->
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <!-- Ícone Lua (Modo Claro) -->
                    <svg class="w-5 h-5 block dark:hidden text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>

            </div>

        </div>

        <script>
            function toggleNavDropdown(id, event) {
                if (event) {
                    event.stopPropagation();
                }
                const el = document.getElementById(id);
                const otherId = id === 'menuReceita' ? 'menuDespesa' : 'menuReceita';
                const otherEl = document.getElementById(otherId);
                if (otherEl) otherEl.classList.add('hidden');
                if (el) el.classList.toggle('hidden');
            }

            document.addEventListener('click', function(e) {
                ['menuReceita', 'menuDespesa'].forEach(function(id) {
                    const menu = document.getElementById(id);
                    if (menu && !menu.classList.contains('hidden')) {
                        if (!menu.parentElement.contains(e.target)) {
                            menu.classList.add('hidden');
                        }
                    }
                });
            });
        </script>
    </nav>

    <!-- ========================================================= -->
    <!-- FLASH MESSAGES (sucesso / erro) -->
    <!-- ========================================================= -->
    <div th:fragment="flash" th:if="${mensagem}"
         th:classappend="${tipoMensagem == 'sucesso'}
                         ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200'
                         : 'bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200'"
         class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 mb-2">
        <div th:classappend="${tipoMensagem == 'sucesso'}
                              ? 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200'
                              : 'bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200'"
             class="flex items-center gap-3 border rounded-xl px-4 py-3 text-sm font-medium shadow-sm">
            <!-- Ícone sucesso -->
            <svg th:if="${tipoMensagem == 'sucesso'}" class="w-5 h-5 shrink-0 text-emerald-600 dark:text-emerald-400"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <!-- Ícone erro -->
            <svg th:if="${tipoMensagem != 'sucesso'}" class="w-5 h-5 shrink-0 text-rose-600 dark:text-rose-400"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span th:text="${mensagem}">Mensagem aqui</span>
        </div>
    </div>

</body>
</html>
