<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Pessoas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        body {
            font-family: 'Inter', sans-serif;
        }

    </style>

</head>


<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white transition-colors duration-200">

    <!-- NAVBAR -->
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 pb-16">

    <!-- CADASTRO -->
    <div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors">


        <!-- CABEÇALHO -->

        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">

            <div class="flex items-center gap-3">

                <div class="p-2.5 bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 rounded-xl border border-rose-100 dark:border-rose-800/40">

                    <svg class="w-5 h-5"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm7-4a4 4 0 110 8 4 4 0 010-8z">
                        </path>

                    </svg>

                </div>


                <div>

                    <h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">

                        Pessoas

                    </h2>

                    <p class="text-xs font-medium text-slate-400 mt-0.5">

                        Cadastre quem utiliza o seu cartão

                    </p>

                </div>

            </div>


            <a th:href="@{/home}"

               class="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">

                <span>←</span>

                Voltar

            </a>

        </div>


        <!-- FORMULÁRIO -->

        <form th:action="@{/pessoa}"
              th:object="${pessoa}"
              method="POST"
              class="space-y-5">


            <div>

                <label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">

                    Nome

                </label>


                <input type="text"
                       th:field="*{nome}"
                       required
                       placeholder="Ex: Maria, João, Pedro..."

                       class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">

            </div>


            <!-- BOTÃO -->

            <div class="flex justify-end pt-2">

                <button type="submit"

                        class="inline-flex items-center gap-2 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white text-sm font-bold px-6 py-3 rounded-xl shadow-sm transition-all duration-150">

                    <span>✓</span>

                    Cadastrar Pessoa

                </button>

            </div>


        </form>

    </div>


    <!-- LISTAGEM -->

    <div class="max-w-3xl mx-auto bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors">


        <div class="flex items-center gap-2.5 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">

            <span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span>

            <h2 class="text-lg font-bold text-slate-900 dark:text-white tracking-tight">

                Pessoas Cadastradas

            </h2>

        </div>


        <div class="overflow-x-auto">

            <table class="w-full text-left border-collapse">


                <thead>

                    <tr class="border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/30">

                        <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider">

                            Nome

                        </th>

                        <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider text-right">

                            Ações

                        </th>

                    </tr>

                </thead>


                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">


                    <tr th:each="pessoa : ${paginaPessoa.content}"

                        class="hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition duration-150">


                        <td class="p-3">

                            <span class="text-sm font-semibold text-slate-800 dark:text-slate-100"

                                  th:text="${pessoa.nome}">

                                Maria

                            </span>

                        </td>


                        <td class="p-3 text-right">


                            <form th:action="@{/pessoa/excluir}"
                                  method="POST"
                                  class="inline">


                                <input type="hidden"
                                       name="id"
                                       th:value="${pessoa.id}">


                                <button type="submit"

                                        onclick="return confirm('Deseja realmente excluir esta pessoa?')"

                                        class="inline-flex items-center gap-1.5 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-300 text-xs font-bold px-3 py-2 rounded-lg border border-rose-100 dark:border-rose-800/40 transition">

                                    Excluir

                                </button>

                            </form>

                        </td>

                    </tr>


                    <!-- NENHUMA PESSOA -->

                    <tr th:if="${paginaPessoa.content.empty}">

                        <td colspan="2"
                            class="p-8 text-center">

                            <p class="text-sm font-semibold text-slate-400">

                                Nenhuma pessoa cadastrada.

                            </p>

                            <p class="text-xs text-slate-300 dark:text-slate-500 mt-1">

                                Cadastre alguém acima para começar.

                            </p>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </div>

    </main>

</body>

</html>
