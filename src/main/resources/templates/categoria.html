<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white p-4 sm:p-8 transition-colors duration-200">
    
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Formulário de Cadastro -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 md:col-span-1 h-fit transition-colors">
            <div class="flex items-center gap-2.5 mb-5 pb-3 border-b border-slate-100 dark:border-slate-800">
                <div class="p-2 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 rounded-lg">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                </div>
                <div>
                    <h2 class="text-base font-bold text-slate-900 dark:text-white tracking-tight">Nova Categoria</h2>
                    <p class="text-[11px] font-medium text-slate-400">Cadastre ou edite uma opção</p>
                </div>
            </div>
            
           <form th:action="@{/categoria}" th:object="${categoria}" method="POST" class="space-y-4">
                <input type="hidden" th:field="*{id}" />

                <div>
                    <label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Nome</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: Alimentação" required 
                           class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Tipo</label>
                    <select th:field="*{tipo}" class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150">
                        <option value="DESPESA">Despesa</option>
                        <option value="RECEITA">Receita</option>
                    </select>
                </div>

                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-sm py-2.5 rounded-xl shadow-md shadow-indigo-100 dark:shadow-none transition duration-150">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Salvar
                </button>
           </form>
        </div>

        <!-- Tabela de Listagem -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 md:col-span-2 transition-colors">
            <!-- Cabeçalho com Título e Botão Voltar -->
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                    <h2 class="text-base font-bold text-slate-900 dark:text-white tracking-tight">Categorias Cadastradas</h2>
                </div>
				<a th:href="@{/home}" 
				   class="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">
				    <span>←</span> Voltar
				</a>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/30">
                            <!-- <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider">ID</th> -->
                            <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider">Nome</th>
                            <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider">Tipo</th>
                            <th class="p-3 text-xs uppercase font-bold text-slate-400 tracking-wider text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                        <!-- Alterado de ${categoria} para ${categorias} para evitar conflito com o form -->
                        <tr th:each="cat : ${categorias}" class="hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition duration-150">
                            <!-- <td class="p-3 text-xs font-medium text-slate-400" th:text="${cat.id}">1</td> -->
                            <td class="p-3 text-sm font-semibold text-slate-800 dark:text-slate-100" th:text="${cat.nome}">Alimentação</td>
                            <td class="p-3">
                                <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg border uppercase tracking-wider inline-block"
                                      th:classappend="${cat.tipo == 'RECEITA' ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'}"
                                      th:text="${cat.tipo}">DESPESA</span>
                            </td>
                            <td class="p-3 text-right">
                                <div class="flex justify-end gap-1.5 text-xs">
                                    <a th:href="@{/categoria/update/{id}(id=${cat.id})}" 
                                       class="inline-flex items-center gap-1 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100/80 dark:hover:bg-amber-900/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/40 px-2.5 py-1 rounded-lg font-semibold transition duration-150">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                        Editar
                                    </a>
                                    <form th:action="@{/categoria/delete/{id}(id=${cat.id})}" method="POST" class="inline"
                                          th:onsubmit="return confirm('Deseja excluir esta categoria?');">
                                        <button type="submit" 
                                                class="inline-flex items-center gap-1 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100/80 dark:hover:bg-rose-900/50 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/40 px-2.5 py-1 rounded-lg font-semibold transition duration-150">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            Excluir
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
