<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar Cartão de Crédito</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class'
		}
	</script>
	<script>
		if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark');
		} else {
			document.documentElement.classList.remove('dark');
		}
		function toggleDarkMode() {
			if (document.documentElement.classList.contains('dark')) {
				document.documentElement.classList.remove('dark');
				localStorage.setItem('theme', 'light');
			} else {
				document.documentElement.classList.add('dark');
				localStorage.setItem('theme', 'dark');
			}
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Inter', sans-serif; }
	</style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-white transition-colors duration-200">

	<!-- NAVBAR -->
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
		<div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 mb-8 transition-colors">
		
		<!-- Cabeçalho com Título e Botão Voltar -->
		<div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
			<div class="flex items-center gap-3">
				<div class="p-2.5 bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 rounded-xl border border-amber-100 dark:border-amber-800/40">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
				</div>
				<div>
					<h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Editar Cartão de Crédito</h2>
					<p class="text-xs font-medium text-slate-400 mt-0.5">Altere as informações do cartão selecionado</p>
				</div>
			</div>

			<a th:href="@{/cartao}"
				class="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">
				<span>←</span> Voltar
			</a>
		</div>

		<!-- Envia para o mesmo endpoint de criação/atualização -->
		<form th:action="@{/cartao/update/{id}(id=${cartao.id})}" th:object="${cartao}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-5">
			<!-- Campo Oculto para ID (essencial para atualizar em vez de criar outro) -->
			<input type="hidden" th:field="*{id}" />

			<div class="col-span-1 md:col-span-1">
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Nome do Cartão</label>
				<input type="text" th:field="*{nome}" placeholder="Ex: Nubank, Itaú" required
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div class="col-span-1 md:col-span-1">
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Limite (R$)</label>
				<input type="text" data-moeda="limite" required placeholder="R$ 0,00" inputmode="numeric" autocomplete="off"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400 tabular-nums">
				<!-- Campo oculto para binding com BigDecimal no Spring -->
				<input type="hidden" th:field="*{limite}">
			</div>

			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Dia de Fechamento</label>
				<input type="number" min="1" max="31" th:field="*{diaFechamento}" required placeholder="Ex: 25"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Dia de Vencimento</label>
				<input type="number" min="1" max="31" th:field="*{diaVencimento}" required placeholder="Ex: 05"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div class="col-span-1 md:col-span-2 pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
				<button type="submit" class="w-full md:w-auto inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-md shadow-amber-100 dark:shadow-none transition duration-150">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
					Atualizar Cartão
				</button>
			</div>
		</form>

	</div>
	</main>

	<script th:src="@{/js/moeda.js}"></script>

</body>

</html>
