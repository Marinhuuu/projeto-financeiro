<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Receitas</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class'
		}
	</script>
	<script>
		if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark');
		} else {
			document.documentElement.classList.remove('dark');
		}
		function toggleDarkMode() {
			if (document.documentElement.classList.contains('dark')) {
				document.documentElement.classList.remove('dark');
				localStorage.setItem('theme', 'light');
			} else {
				document.documentElement.classList.add('dark');
				localStorage.setItem('theme', 'dark');
			}
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Inter', sans-serif; }
	</style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-200">

	<!-- NAVBAR -->
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">
		<div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 mb-8 transition-colors">

		<!-- Cabeçalho -->
		<div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">

			<div class="flex items-center gap-3">
				<div class="p-2.5 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 rounded-xl border border-emerald-100 dark:border-emerald-800/40">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
				</div>
				<div>
					<h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">
						Nova Receita
					</h2>
					<p class="text-xs font-medium text-slate-400 mt-0.5">Preencha os dados abaixo para cadastrar a entrada</p>
				</div>
			</div>

			<a th:href="@{/home}"
				class="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">
				<span>←</span> Voltar
			</a>

		</div>

		<!-- FORMULÁRIO -->
		<form th:action="@{/receita/create}"
			  th:object="${receita}"
			  method="POST"
			  class="grid grid-cols-1 sm:grid-cols-2 gap-5">

			<!-- Descrição -->
			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
					Descrição
				</label>

				<input type="text"
					   th:field="*{descricao}"
					   required
					   placeholder="Ex: Salário, Freelance, Rendimentos..."
					   class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<!-- Categoria -->
			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
					Categoria
				</label>

				<select th:field="*{categoria.id}"
						class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150"
						required>

					<option value="">
						Selecione uma categoria
					</option>

					<option th:each="cat : ${categoria}"
							th:value="${cat.id}"
							th:text="${cat.nome}">
					</option>

				</select>
			</div>

			<!-- Valor -->
			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
					Valor
				</label>

				<div class="relative">
					<input type="text"
						   data-moeda="valor"
						   required
						   placeholder="R$ 0,00"
						   inputmode="numeric"
						   autocomplete="off"
						   class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400 tabular-nums">
					<!-- Campo oculto para binding com BigDecimal no Spring -->
					<input type="hidden" th:field="*{valor}">
				</div>
			</div>

			<!-- Data -->
			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">
					Data de Recebimento
				</label>

				<input type="date"
					   th:field="*{dataEntrada}"
					   required
					   class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150">
			</div>

			<!-- Recorrente -->
			<div class="col-span-1 sm:col-span-2 pt-1">

				<div class="flex items-center gap-3 bg-slate-50/80 dark:bg-slate-800/60 p-3.5 rounded-xl border border-slate-100 dark:border-slate-700 hover:bg-slate-100/50 dark:hover:bg-slate-700/50 transition duration-150 cursor-pointer">
					<input type="checkbox"
						   th:field="*{recorrente}"
						   id="recorrente"
						   class="w-4 h-4 text-emerald-600 accent-emerald-600 rounded border-slate-300 focus:ring-emerald-500 cursor-pointer">

					<label for="recorrente"
						   class="text-sm font-semibold text-slate-700 dark:text-slate-200 cursor-pointer select-none">
						Receita Recorrente? <span class="text-xs font-normal text-slate-400">(Repete mensalmente)</span>
					</label>
				</div>

			</div>

			<!-- Botão -->
			<div class="col-span-1 sm:col-span-2 pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">

				<button type="submit"
						class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-md shadow-emerald-100 dark:shadow-none transition duration-150">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
					Salvar Receita
				</button>

			</div>

		</form>

	</div>
	</main>

	<script th:src="@{/js/moeda.js}"></script>

</body>

</html>
