<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- ========================================================= -->
    <!-- SELETOR DE CICLO                                          -->
    <!-- Usa os atributos publicados por config/CicloSelecionado.  -->
    <!-- url: rota da tela; permiteTodos: exibe a opção "Todos".   -->
    <!-- A escolha fica na sessão e vale para todas as telas.      -->
    <!-- ========================================================= -->
    <div th:fragment="seletor(url, permiteTodos)"
         class="bg-white dark:bg-slate-900 px-4 py-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 transition-colors">

        <div class="flex items-center gap-2 min-w-0">
            <span class="p-2 bg-purple-50 dark:bg-purple-950/40 text-purple-600 dark:text-purple-400 rounded-lg border border-purple-100 dark:border-purple-800/40 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </span>

            <div class="min-w-0">
                <p class="text-[11px] uppercase font-bold tracking-wider text-slate-400 dark:text-slate-500">
                    Ciclo
                </p>

                <p th:if="${!cicloTodos}"
                   class="text-sm font-bold text-slate-800 dark:text-slate-100 flex flex-wrap items-center gap-2">
                    <span th:text="${#temporals.format(cicloSelecionado.dataInicio, 'dd/MM/yyyy') + ' a ' + #temporals.format(cicloSelecionado.dataFim, 'dd/MM/yyyy')}">
                        26/09/2026 a 25/10/2026
                    </span>
                    <span th:if="${cicloEhAtual}"
                          class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800/40">
                        Atual
                    </span>
                </p>

                <p th:if="${cicloTodos}"
                   class="text-sm font-bold text-slate-800 dark:text-slate-100">
                    Todos os ciclos
                </p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <a th:if="${!cicloTodos}"
               th:href="@{${url}(ciclo=${cicloAnteriorRef})}"
               class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700 transition">
                ← Anterior
            </a>

            <a th:if="${!cicloTodos}"
               th:href="@{${url}(ciclo=${cicloProximoRef})}"
               class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700 transition">
                Próximo →
            </a>

            <a th:if="${!cicloEhAtual}"
               th:href="@{${url}(ciclo='atual')}"
               class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-bold transition">
                Ciclo atual
            </a>

            <a th:if="${permiteTodos and !cicloTodos}"
               th:href="@{${url}(ciclo='todos')}"
               class="px-3 py-1.5 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-xs font-bold text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 transition">
                Ver todos
            </a>
        </div>
    </div>

</body>
</html>
