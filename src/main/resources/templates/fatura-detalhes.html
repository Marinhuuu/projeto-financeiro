<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Fatura</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-indigo-500 selection:text-white p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- CABEÇALHO -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">

            <div class="flex items-center gap-3.5">
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl border border-indigo-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
                        Detalhes da Fatura
                    </h1>

                    <p class="text-xs sm:text-sm font-medium text-slate-400 mt-0.5"
                       th:text="${fatura.cartao.nome}">
                        Cartão
                    </p>
                </div>
            </div>

            <a th:href="@{/faturas}"
               class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl transition-all duration-150">
                <span>←</span> Voltar
            </a>

        </div>

        <!-- INFORMAÇÕES DA FATURA (CARDS DE RESUMO) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

            <!-- REFERÊNCIA -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                        Referência
                    </p>
                    <p class="text-2xl font-black text-slate-900 tracking-tight font-mono"
                       th:text="${fatura.mesReferencia + '/' + fatura.anoReferencia}">
                        08/2026
                    </p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
            </div>

            <!-- FECHAMENTO -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                        Fechamento
                    </p>
                    <p class="text-2xl font-black text-slate-900 tracking-tight font-mono"
                       th:text="${#temporals.format(fatura.dataFechamento, 'dd/MM/yyyy')}">
                        10/08/2026
                    </p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>

            <!-- VENCIMENTO -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">
                        Vencimento
                    </p>
                    <p class="text-2xl font-black text-slate-900 tracking-tight font-mono"
                       th:text="${#temporals.format(fatura.dataVencimento, 'dd/MM/yyyy')}">
                        20/08/2026
                    </p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- VALOR TOTAL -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-indigo-600 mb-1">
                        Valor Total
                    </p>
                    <p class="text-2xl font-extrabold text-indigo-600 tracking-tight font-mono"
                       th:text="${'R$ ' + #numbers.formatDecimal(fatura.valorTotal, 1, 2)}">
                        R$ 0,00
                    </p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

        </div>

        <!-- STATUS -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                    <h2 class="font-bold text-slate-900 text-sm tracking-tight">
                        Status da Fatura
                    </h2>
                </div>

                <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200"
                      th:text="${fatura.statusFatura}">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                    ABERTA
                </span>
            </div>
        </div>

        <!-- PARCELAS DA FATURA -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

            <div class="p-5 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-900 tracking-tight">
                    Parcelas da Fatura
                </h2>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left border-collapse">

                    <thead>
                        <tr class="bg-slate-50/50 text-slate-400 text-xs uppercase font-bold tracking-wider border-b border-slate-100">
                            <th class="py-3.5 px-5 text-center">Parcela</th>
                            <th class="py-3.5 px-5">Descrição</th>
                            <th class="py-3.5 px-5">Vencimento</th>
                            <th class="py-3.5 px-5">Valor</th>
                            <th class="py-3.5 px-5">Status</th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-slate-100 text-sm">

                        <tr th:each="parcela : ${fatura.parcelas}"
                            class="hover:bg-slate-50/80 transition duration-150">

                            <!-- PARCELA -->
                            <td class="py-4 px-5 text-center">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200/60"
                                      th:text="${parcela.qtdParcela}">
                                    1
                                </span>
                            </td>

                            <!-- DESCRIÇÃO -->
                            <td class="py-4 px-5 font-semibold text-slate-800"
                                th:text="${parcela.despesa.descricao}">
                                Compra
                            </td>

                            <!-- VENCIMENTO -->
                            <td class="py-4 px-5 text-slate-500 font-mono text-xs font-medium"
                                th:text="${#temporals.format(parcela.dataVencimento, 'dd/MM/yyyy')}">
                                20/08/2026
                            </td>

                            <!-- VALOR -->
                            <td class="py-4 px-5 font-extrabold text-slate-900 font-mono"
                                th:text="${'R$ ' + #numbers.formatDecimal(parcela.valorParcela, 1, 2)}">
                                R$ 100,00
                            </td>

                            <!-- STATUS PARCELA -->
                            <td class="py-4 px-5">
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200"
                                      th:text="${parcela.statusParcela}">
                                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                                    PENDENTE
                                </span>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
