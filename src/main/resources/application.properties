spring.application.name=financeiro

## --- JPA / Hibernate ---

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Carrega associações em lotes (evita uma consulta por registro nas listagens)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Thymeleaf ---

spring.thymeleaf.cache=false

# --- Servidor ---
# No Render a porta vem da variavel PORT (padrao 10000)

server.port=${PORT:8080}
server.address=0.0.0.0

# --- Sessão ---
# Cookie de sessão não vai em requisições vindas de outros sites (reforço contra CSRF)
server.servlet.session.cookie.same-site=lax
# Usa os cabeçalhos X-Forwarded-* do proxy do Render (IP real e HTTPS)
server.forward-headers-strategy=native
