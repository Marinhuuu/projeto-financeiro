<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased selection:bg-amber-500 selection:text-white p-4 sm:p-8">
    
    <div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
        
        <!-- Cabeçalho com Título e Botão Voltar -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-amber-50 text-amber-600 rounded-xl border border-amber-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Editar Categoria</h2>
                    <p class="text-xs font-medium text-slate-400 mt-0.5">Altere os dados da categoria selecionada</p>
                </div>
            </div>

            <button onclick="history.back()" 
                    class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">
                <span>←</span> Voltar
            </button>
        </div>
        
        <!-- Formulário apontando para /categoria/create (onde o id preenchido aciona a atualização/salvamento) -->
        <form th:action="@{/categoria/create}" th:object="${categoria}" method="POST" class="space-y-5">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-xs uppercase font-bold text-slate-500 mb-1.5 tracking-wider">Nome</label>
                <input type="text" th:field="*{nome}" required 
                       class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition duration-150 placeholder:text-slate-400">
            </div>

            <div>
                <label class="block text-xs uppercase font-bold text-slate-500 mb-1.5 tracking-wider">Tipo</label>
                <select th:field="*{tipo}" class="w-full border border-slate-200 bg-slate-50/50 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition duration-150">
                    <option value="DESPESA">Despesa</option>
                    <option value="RECEITA">Receita</option>
                </select>
            </div>

            <div class="pt-2 border-t border-slate-100">
                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold text-sm py-2.5 rounded-xl shadow-md shadow-amber-100 transition duration-150">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Atualizar Categoria
                </button>
            </div>
        </form>

    </div>

</body>
</html>
