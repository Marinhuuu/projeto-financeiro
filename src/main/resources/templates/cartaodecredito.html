<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cartões de Crédito</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class'
		}
	</script>
	<script>
		if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
			document.documentElement.classList.add('dark');
		} else {
			document.documentElement.classList.remove('dark');
		}
		function toggleDarkMode() {
			if (document.documentElement.classList.contains('dark')) {
				document.documentElement.classList.remove('dark');
				localStorage.setItem('theme', 'light');
			} else {
				document.documentElement.classList.add('dark');
				localStorage.setItem('theme', 'dark');
			}
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Inter', sans-serif; }
	</style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-purple-500 selection:text-white transition-colors duration-200">

	<!-- NAVBAR -->
	<nav th:replace="~{fragments/navbar :: navbar}"></nav>

	<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 space-y-8">
		<!-- FORMULÁRIO DE CADASTRO -->
		<div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors">
		
		<!-- Cabeçalho com Título e Botão Voltar -->
		<div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
			<div class="flex items-center gap-3">
				<div class="p-2.5 bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 rounded-xl border border-purple-100 dark:border-purple-800/40">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
				</div>
				<div>
					<h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Cadastrar Cartão de Crédito</h2>
					<p class="text-xs font-medium text-slate-400 mt-0.5">Gerencie seus limites e datas de fechamento</p>
				</div>
			</div>

			<a th:href="@{/home}"
				class="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 text-slate-700 dark:text-slate-300 text-xs font-bold px-3.5 py-2 rounded-xl transition-all duration-150">
				<span>←</span> Voltar
			</a>
		</div>

		<form th:action="@{/cartao/create}" th:object="${cartaoCredito}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-5">
			<!-- Campo Oculto para ID (necessário em edições) -->
			<input type="hidden" th:field="*{id}" />

			<div class="col-span-1 md:col-span-1">
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Nome do Cartão</label>
				<input type="text" th:field="*{nome}" placeholder="Ex: Nubank, Itaú, XP..." required
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div class="col-span-1 md:col-span-1">
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Limite (R$)</label>
				<input type="number" step="0.01" th:field="*{limite}" required placeholder="0,00"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Dia de Fechamento</label>
				<input type="number" min="1" max="31" th:field="*{diaFechamento}" required placeholder="Ex: 25"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div>
				<label class="block text-xs uppercase font-bold text-slate-500 dark:text-slate-400 mb-1.5 tracking-wider">Dia de Vencimento</label>
				<input type="number" min="1" max="31" th:field="*{diaVencimento}" required placeholder="Ex: 05"
					class="w-full border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-slate-700 transition duration-150 placeholder:text-slate-400">
			</div>

			<div class="col-span-1 md:col-span-2 pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
				<button type="submit" class="w-full md:w-auto inline-flex items-center justify-center gap-2 bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-md shadow-purple-100 dark:shadow-none transition duration-150">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
					Salvar Cartão
				</button>
			</div>
		</form>
	</div>

	<!-- Lista de Cartões (Estilo Card) -->
	<div class="max-w-4xl mx-auto space-y-4">
		<div class="flex items-center gap-2">
			<span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
			<h2 class="text-lg font-bold text-slate-900 dark:text-white tracking-tight">Meus Cartões</h2>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
			<div th:each="c : ${cartao}"
				class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 hover:shadow-md transition duration-200 flex flex-col justify-between relative overflow-hidden group">
				<div class="absolute top-0 left-0 w-1.5 h-full bg-purple-600 rounded-l"></div>

				<div>
					<!-- Chip Visual do Cartão + Nome -->
					<div class="flex justify-between items-start mb-4">
						<div class="space-y-1">
							<div class="w-9 h-6 bg-gradient-to-tr from-amber-200 to-amber-400 rounded-md border border-amber-300 shadow-inner flex items-center justify-center">
								<div class="w-6 h-3 border-y border-amber-600/30"></div>
							</div>
							<h3 class="text-lg font-black text-slate-800 dark:text-white tracking-tight pt-1" th:text="${c.nome}">Itaú Personnalité</h3>
						</div>

						<div class="text-right">
							<span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Limite Disponível</span>
							<span class="text-base font-extrabold text-purple-700 dark:text-purple-400"
								th:text="${'R$ ' + #numbers.formatDecimal(c.limite, 1, 2)}">R$ 5.000,00</span>
						</div>
					</div>

					<!-- Datas de Fechamento e Vencimento -->
					<div class="grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-300 bg-slate-50/80 dark:bg-slate-950/50 p-3 rounded-xl border border-slate-100/80 dark:border-slate-800">
						<div class="flex flex-col">
							<span class="text-[10px] uppercase font-bold text-slate-400">Fechamento</span>
							<span class="font-bold text-slate-800 dark:text-slate-100 mt-0.5" th:text="${'Dia ' + c.diaFechamento}">Dia 25</span>
						</div>
						<div class="flex flex-col border-l border-slate-200/60 dark:border-slate-700 pl-3">
							<span class="text-[10px] uppercase font-bold text-slate-400">Vencimento</span>
							<span class="font-bold text-slate-800 dark:text-slate-100 mt-0.5" th:text="${'Dia ' + c.diaVencimento}">Dia 05</span>
						</div>
					</div>
				</div>

				<!-- Botões de Ação (Editar / Excluir) -->
				<div class="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
					<a th:href="@{/cartao/update/{id}(id=${c.id})}"
						class="inline-flex items-center gap-1 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100/80 dark:hover:bg-amber-900/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/40 px-3 py-1.5 rounded-lg font-semibold transition duration-150">
						<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
						Editar
					</a>

					<form th:action="@{/cartao/delete/{id}(id=${c.id})}" method="POST" class="inline"
						th:onsubmit="return confirm('Tem certeza que deseja excluir este cartão?');">
						<button type="submit"
							class="inline-flex items-center gap-1 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100/80 dark:hover:bg-rose-900/50 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/40 px-3 py-1.5 rounded-lg font-semibold transition duration-150">
							<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
							Excluir
						</button>
					</form>
				</div>
			</div>
		</div>
	</div>
	</main>
</body>

</html>
